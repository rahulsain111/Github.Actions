name: Jenkins Trigger

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag name
        required: true
        default: 3.26.6

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Jenkins
        env:
          TAG: ${{ github.event.inputs.tag_name }}
        run: |
          URL="https://cloudbees.ais.acquia.io/dat-ops-jenkins"
          JOB="HAAS-DRUPAL%2Fauto-deploy-staging"
          TOKEN="staging-deploy-token"
          ENV_IDS="58413-bdd0c769-f692-44bc-9641-b05c7eb57b0f"
          echo "Triggering Jenkins build..."
          echo "Job: HAAS-DRUPAL/auto-deploy-staging"
          echo "Tag: ${TAG}"
          curl -v -X POST "${URL}/buildByToken/buildWithParameters?job=${JOB}&token=${TOKEN}&TAG_NAME=${TAG}&STAGING_ENV_IDS=${ENV_IDS}"
