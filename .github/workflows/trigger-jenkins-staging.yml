name: Trigger Jenkins Auto-Deploy Staging

on:
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to deploy (e.g., 3.26.6)'
        required: true
        default: '3.26.6'

  # Auto trigger on new tags (enable this later for haas-drupal)
  # push:
  #   tags:
  #     - '*'

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Get Tag Name
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Get Jenkins Crumb
        id: crumb
        run: |
          CRUMB=$(curl -s -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            "https://cloudbees.ais.acquia.io/dat-ops-jenkins/crumbIssuer/api/json" \
            | jq -r '.crumb')
          echo "CRUMB=$CRUMB" >> $GITHUB_OUTPUT

      - name: Trigger Jenkins Build
        run: |
          TAG_NAME="${{ steps.tag.outputs.TAG_NAME }}"
          CRUMB="${{ steps.crumb.outputs.CRUMB }}"

          echo "Triggering deployment for tag: $TAG_NAME"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            -H "Jenkins-Crumb: $CRUMB" \
            "https://cloudbees.ais.acquia.io/dat-ops-jenkins/job/HAAS-DRUPAL/job/auto-deploy-staging/buildWithParameters?token=staging-deploy-token&TAG_NAME=$TAG_NAME&STAGING_ENV_IDS=58413-bdd0c769-f692-44bc-9641-b05c7eb57b0f")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Jenkins build triggered successfully!"
          else
            echo "❌ Failed to trigger Jenkins build"
            echo "$BODY"
            exit 1
          fi
