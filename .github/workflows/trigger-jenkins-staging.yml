name: Trigger Jenkins Auto-Deploy Staging

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to deploy'
        required: true
        default: '3.26.6'

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Build
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name }}
          JENKINS_URL: https://cloudbees.ais.acquia.io/dat-ops-jenkins
          STAGING_ENV_IDS: 58413-bdd0c769-f692-44bc-9641-b05c7eb57b0f
          BUILD_TOKEN: staging-deploy-token
        run: |
          echo "Triggering deployment for tag: $TAG_NAME"
          curl -v -X POST "$JENKINS_URL/job/HAAS-DRUPAL/job/auto-deploy-staging/buildWithParameters?token=$BUILD_TOKEN&TAG_NAME=$TAG_NAME&STAGING_ENV_IDS=$STAGING_ENV_IDS"
