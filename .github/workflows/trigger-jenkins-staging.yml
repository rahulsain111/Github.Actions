name: Trigger Jenkins Auto-Deploy Staging

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to deploy (e.g., 3.26.6)'
        required: true
        default: '3.26.6'

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Get Tag Name
        id: tag
        run: |
          echo "TAG_NAME=${{ github.event.inpB_OUTPUT

      - name: Test Jenkins Connection
        run: |
          echo "Testing Jenkins API connectio

          # Test crumb endpoint
          echo "=== Crumb Response ==="
          CRUMB_RESPONSE=$(curl -s -w "\nHTTP
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            "https://cloudbees.ais.acquia.io/r/api/json")

          echo "$CRUMB_RESPONSE"

          HTTP_CODE=$(echo "$CRUMB_RESPONSE" -d: -f2)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Failed to get crumb. HTTP: $HTTP_CODE"
            echo "Jenkins authentication may
            exit 1
          fi

          CRUMB=$(echo "$CRUMB_RESPONSE" | gr '.crumb')
          echo "CRUMB=$CRUMB" >> $GITHUB_ENV

      - name: Trigger Jenkins Build
        run: |
          TAG_NAME="${{ steps.tag.outputs.TAG_NAME }}"

          echo "Triggering deployment for tag: $TAG_NAME"

          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
            -u "${{ secrets.JENKINS_USER }}:$}" \
            -H "Jenkins-Crumb: $CRUMB" \
            "https://cloudbees.ais.acquia.io/RUPAL/job/auto-deploy-staging/buildWithParameters?token=staging-deploy-token&TAG_NAME=$TAG_NAME&STAGING_ENV_IDS=58413-bdd0c769-f692-44bc-9641-b05c7eb57b0f")

          echo "=== Response ==="
          echo "$RESPONSE"

          HTTP_CODE=$(echo "$RESPONSE" | grep2)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$
            echo "✅ Jenkins build triggered successfully!"
          else
            echo "❌ Failed to trigger Jenkins build. HTTP: $HTTP_CODE"
            exit 1
          fi
